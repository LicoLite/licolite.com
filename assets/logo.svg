<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 -150 300 300" role="img" aria-label="LicoLite Logo">
  <title>LicoLite</title>
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#e4b84a"/>
      <stop offset="50%"  stop-color="#f5dc72"/>
      <stop offset="100%" stop-color="#c99b2e"/>
    </linearGradient>
    <linearGradient id="crystal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#56d4e8"/>
      <stop offset="100%" stop-color="#8aecf5"/>
    </linearGradient>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#e4b84a" stop-opacity="0.7"/>
      <stop offset="50%"  stop-color="#8aecf5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#56d4e8" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Outermost decorative ring -->
  <circle r="140" fill="none" stroke="url(#prism)" stroke-width="0.5" opacity="0.3"/>

  <!-- Tick marks — 16 evenly-spaced dashes -->
  <g fill="none" opacity="0.2" stroke="#e4b84a" stroke-width="0.8">
    <line x1="0" y1="-134" x2="0" y2="-140" transform="rotate(0)"/>
    <line x1="0" y1="-134" x2="0" y2="-140" transform="rotate(22.5)"/>
    <line x1="0" y1="-134" x2="0" y2="-140" transform="rotate(45)"/>
    <line x1="0" y1="-134" x2="0" y2="-140" transform="rotate(67.5)"/>
    <line x1="0" y1="-134" x2="0" y2="-140" transform="rotate(90)"/>
    <line x1="0" y1="-134" x2="0" y2="-140" transform="rotate(112.5)"/>
    <line x1="0" y1="-134" x2="0" y2="-140" transform="rotate(135)"/>
    <line x1="0" y1="-134" x2="0" y2="-140" transform="rotate(157.5)"/>
    <line x1="0" y1="-134" x2="0" y2="-140" transform="rotate(180)"/>
    <line x1="0" y1="-134" x2="0" y2="-140" transform="rotate(202.5)"/>
    <line x1="0" y1="-134" x2="0" y2="-140" transform="rotate(225)"/>
    <line x1="0" y1="-134" x2="0" y2="-140" transform="rotate(247.5)"/>
    <line x1="0" y1="-134" x2="0" y2="-140" transform="rotate(270)"/>
    <line x1="0" y1="-134" x2="0" y2="-140" transform="rotate(292.5)"/>
    <line x1="0" y1="-134" x2="0" y2="-140" transform="rotate(315)"/>
    <line x1="0" y1="-134" x2="0" y2="-140" transform="rotate(337.5)"/>
  </g>

  <!-- Outer octagon -->
  <polygon fill="none"
    points="115.5,47.8 47.8,115.5 -47.8,115.5 -115.5,47.8 -115.5,-47.8 -47.8,-115.5 47.8,-115.5 115.5,-47.8"
    stroke="url(#amber)" stroke-width="1.8" opacity="0.6"/>

  <!-- Ring 1 — concentric (amber glow) -->
  <circle r="113" fill="none" stroke="#f5dc72" stroke-width="1.2" opacity="0.35"/>

  <!-- Ring 2 — offset SW (crystal) -->
  <circle cx="-16" cy="16" r="89" fill="none" stroke="url(#crystal)" stroke-width="1.1" opacity="0.35"/>

  <!-- Ring 3 — offset NE (crystal light) -->
  <circle cx="13" cy="-10" r="63" fill="none" stroke="#8aecf5" stroke-width="1.0" opacity="0.4"/>

  <!-- Inner ring -->
  <circle r="36" fill="none" stroke="url(#amber)" stroke-width="1.2" opacity="0.5"/>

  <!-- Central dot — luminous core -->
  <circle r="3.5" fill="url(#prism)" opacity="0.6"/>
  <circle r="1.5" fill="#ffffff" opacity="0.7"/>
</svg>
