<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="LicoLite — Traceable Shared Workspace for AI Agents">
  <title>LicoLite — Traceable Shared Workspace for AI Agents</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#131217"/>
      <stop offset="100%" stop-color="#0e0d11"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#c9a96e"/>
      <stop offset="50%"  stop-color="#f0d28c"/>
      <stop offset="100%" stop-color="#a8893a"/>
    </linearGradient>

    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#4fc3f7"/>
      <stop offset="50%"  stop-color="#b0e8f5"/>
      <stop offset="100%" stop-color="#26a8d8"/>
    </linearGradient>

    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"    stop-color="#c9a96e" stop-opacity="0.8"/>
      <stop offset="20%"   stop-color="#f0d28c" stop-opacity="0.6"/>
      <stop offset="40%"   stop-color="#80deea" stop-opacity="0.7"/>
      <stop offset="60%"   stop-color="#4fc3f7" stop-opacity="0.8"/>
      <stop offset="80%"   stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="100%"  stop-color="#c9a96e" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="facet" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="50%"  stop-color="#f0d28c" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <circle cx="280" cy="200" r="200" fill="url(#glow)"/>

  <!-- Crystal Icon — centered at (280, 200) -->
  <g transform="translate(280,200)">

    <!-- Outer hexagon frame -->
    <polygon
      points="0,-120 103.9,-60 103.9,60 0,120 -103.9,60 -103.9,-60"
      fill="none" stroke="url(#gold)" stroke-width="0.4" opacity="0.2"/>

    <!-- Inner hexagon — crystal core -->
    <polygon
      points="0,-58 50.2,-29 50.2,29 0,58 -50.2,29 -50.2,-29"
      fill="url(#facet)" stroke="url(#gold)" stroke-width="1" opacity="0.6"/>

    <!-- Facet highlights -->
    <polygon points="0,-58 50.2,-29 0,0" fill="#ffffff" opacity="0.06"/>
    <polygon points="0,-58 -50.2,-29 0,0" fill="#ffffff" opacity="0.03"/>

    <!-- Lattice lines -->
    <g opacity="0.18" stroke="url(#ice)" stroke-width="0.4">
      <line x1="0" y1="-58" x2="0" y2="58"/>
      <line x1="-50.2" y1="-29" x2="50.2" y2="29"/>
      <line x1="-50.2" y1="29" x2="50.2" y2="-29"/>
    </g>

    <!-- Lattice nodes -->
    <g opacity="0.55">
      <circle cx="0" cy="-58" r="1.8" fill="#b0e8f5"/>
      <circle cx="50.2" cy="-29" r="1.8" fill="#f0d28c"/>
      <circle cx="50.2" cy="29" r="1.8" fill="#b0e8f5"/>
      <circle cx="0" cy="58" r="1.8" fill="#f0d28c"/>
      <circle cx="-50.2" cy="29" r="1.8" fill="#b0e8f5"/>
      <circle cx="-50.2" cy="-29" r="1.8" fill="#f0d28c"/>
    </g>

    <!-- Central brilliant -->
    <circle r="4.5" fill="url(#gold)" opacity="0.6"/>
    <circle r="2" fill="#ffffff" opacity="0.8"/>

    <!-- Radial rays — 6-fold symmetric -->
    <g stroke="url(#ice)" stroke-width="0.6" opacity="0.3">
      <line x1="0" y1="-62" x2="0" y2="-105"/>
      <line x1="53.7" y1="-31" x2="90.9" y2="-52.5"/>
      <line x1="53.7" y1="31" x2="90.9" y2="52.5"/>
      <line x1="0" y1="62" x2="0" y2="105"/>
      <line x1="-53.7" y1="31" x2="-90.9" y2="52.5"/>
      <line x1="-53.7" y1="-31" x2="-90.9" y2="-52.5"/>
    </g>

  </g>

  <!-- Prismatic separator -->
  <rect x="460" y="158" width="1.5" height="84" fill="url(#prism)" opacity="0.4" rx="0.75"/>

  <!-- Wordmark -->
  <text
    x="500" y="193"
    dominant-baseline="middle"
    font-family="'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="72"
    font-weight="200"
    letter-spacing="12"
    fill="#ede6d6">LICOLITE</text>

  <!-- Subtitle -->
  <text
    x="502" y="242"
    font-family="'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="12.5"
    font-weight="300"
    letter-spacing="4.5"
    fill="#7a8ea8">TRACEABLE SHARED WORKSPACE FOR AI AGENTS</text>

  <!-- Bottom accent -->
  <rect x="502" y="282" width="360" height="0.5" fill="url(#prism)" opacity="0.25" rx="0.25"/>

</svg>
