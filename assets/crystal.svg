<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 -150 300 300" role="img" aria-label="LicoLite Crystal">
  <title>LicoLite</title>

  <defs>
    <!-- Licorice gold gradient -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#c9a96e"/>
      <stop offset="50%"  stop-color="#f0d28c"/>
      <stop offset="100%" stop-color="#a8893a"/>
    </linearGradient>

    <!-- Ice crystal blue gradient -->
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#4fc3f7"/>
      <stop offset="50%"  stop-color="#80deea"/>
      <stop offset="100%" stop-color="#26a8d8"/>
    </linearGradient>

    <!-- Crystal facet highlight -->
    <linearGradient id="facet" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Outer hexagonal frame (crystal form) -->
  <polygon
    points="0,-130 112.6,-65 112.6,65 0,130 -112.6,65 -112.6,-65"
    fill="none" stroke="url(#gold)" stroke-width="0.6" opacity="0.3"/>

  <!-- Second hexagon — rotated 30deg (12-pointed star overlay) -->
  <polygon
    points="0,-120 103.9,-60 103.9,60 0,120 -103.9,60 -103.9,-60"
    fill="none" stroke="url(#ice)" stroke-width="0.4" opacity="0.2"
    transform="rotate(30)"/>

  <!-- Crystal lattice lines — internal structure -->
  <line x1="0" y1="-95" x2="0" y2="95" stroke="url(#ice)" stroke-width="0.5" opacity="0.25"/>
  <line x1="-82.3" y1="-47.5" x2="82.3" y2="47.5" stroke="url(#ice)" stroke-width="0.5" opacity="0.25"/>
  <line x1="-82.3" y1="47.5" x2="82.3" y2="-47.5" stroke="url(#ice)" stroke-width="0.5" opacity="0.25"/>

  <!-- Inner hexagon — crystal core -->
  <polygon
    points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30"
    fill="url(#facet)" stroke="url(#gold)" stroke-width="1.2" opacity="0.55"/>

  <!-- Crystal facet highlights (triangular faces) -->
  <polygon points="0,-60 52,-30 0,0" fill="#ffffff" opacity="0.02"/>
  <polygon points="52,-30 52,30 0,0" fill="#4fc3f7" opacity="0.02"/>
  <polygon points="0,60 -52,30 0,0" fill="#ffffff" opacity="0.015"/>

  <!-- Lattice nodes — where channels intersect -->
  <circle cx="0" cy="-60" r="2.5" fill="#80deea" opacity="0.5"/>
  <circle cx="52" cy="-30" r="2.5" fill="#c9a96e" opacity="0.5"/>
  <circle cx="52" cy="30" r="2.5" fill="#80deea" opacity="0.4"/>
  <circle cx="0" cy="60" r="2.5" fill="#c9a96e" opacity="0.5"/>
  <circle cx="-52" cy="30" r="2.5" fill="#80deea" opacity="0.4"/>
  <circle cx="-52" cy="-30" r="2.5" fill="#c9a96e" opacity="0.5"/>

  <!-- Central brilliant — the focused light point -->
  <circle r="5" fill="url(#gold)" opacity="0.7"/>
  <circle r="2.5" fill="#ffffff" opacity="0.6"/>

  <!-- Radial beams — extending from vertices along 6-fold axes -->
  <line x1="0" y1="-65" x2="0" y2="-105" stroke="url(#ice)" stroke-width="0.6" opacity="0.2"/>
  <line x1="56.3" y1="-32.5" x2="91" y2="-52.5" stroke="#c9a96e" stroke-width="0.6" opacity="0.2"/>
  <line x1="56.3" y1="32.5" x2="91" y2="52.5" stroke="url(#ice)" stroke-width="0.6" opacity="0.2"/>
  <line x1="0" y1="65" x2="0" y2="105" stroke="#c9a96e" stroke-width="0.6" opacity="0.2"/>
  <line x1="-56.3" y1="32.5" x2="-91" y2="52.5" stroke="url(#ice)" stroke-width="0.6" opacity="0.2"/>
  <line x1="-56.3" y1="-32.5" x2="-91" y2="-52.5" stroke="#c9a96e" stroke-width="0.6" opacity="0.2"/>

  <!-- Outer lattice ring — faint crystal boundary markers -->
  <g opacity="0.15" stroke="#80deea" stroke-width="0.6">
    <line x1="0" y1="-126" x2="0" y2="-130"/>
    <line x1="0" y1="126" x2="0" y2="130"/>
    <line x1="-109.1" y1="-63" x2="-112.6" y2="-65"/>
    <line x1="109.1" y1="-63" x2="112.6" y2="-65"/>
    <line x1="-109.1" y1="63" x2="-112.6" y2="65"/>
    <line x1="109.1" y1="63" x2="112.6" y2="65"/>
  </g>
</svg>
