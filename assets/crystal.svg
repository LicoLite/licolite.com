<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 -150 300 300" role="img" aria-label="LicoLite Crystal">
  <title>LicoLite</title>

  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#e4b84a"/>
      <stop offset="50%"  stop-color="#f5dc72"/>
      <stop offset="100%" stop-color="#c99b2e"/>
    </linearGradient>

    <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#56d4e8"/>
      <stop offset="50%"  stop-color="#8aecf5"/>
      <stop offset="100%" stop-color="#2cb8d8"/>
    </linearGradient>

    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#e4b84a" stop-opacity="0.8"/>
      <stop offset="50%"  stop-color="#8aecf5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#56d4e8" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="facet" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="40%"  stop-color="#8aecf5" stop-opacity="0.04"/>
      <stop offset="70%"  stop-color="#e4b84a" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#56d4e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient glow -->
  <circle r="85" fill="url(#glow)" opacity="0.5"/>

  <!-- Outer hexagon frame — crystal boundary -->
  <polygon
    points="0,-120 103.9,-60 103.9,60 0,120 -103.9,60 -103.9,-60"
    fill="none" stroke="url(#prism)" stroke-width="0.4" opacity="0.25"/>

  <!-- Inner hexagon — crystal core -->
  <polygon
    points="0,-58 50.2,-29 50.2,29 0,58 -50.2,29 -50.2,-29"
    fill="url(#facet)" stroke="url(#amber)" stroke-width="0.8" opacity="0.65"/>

  <!-- Facet highlights — refractive surfaces -->
  <polygon points="0,-58 50.2,-29 0,0" fill="#ffffff" opacity="0.07"/>
  <polygon points="0,-58 -50.2,-29 0,0" fill="#8aecf5" opacity="0.03"/>

  <!-- Lattice lines — 3 axes (crystalline structure) -->
  <g opacity="0.22" stroke="url(#crystal)" stroke-width="0.4">
    <line x1="0" y1="-58" x2="0" y2="58"/>
    <line x1="-50.2" y1="-29" x2="50.2" y2="29"/>
    <line x1="-50.2" y1="29" x2="50.2" y2="-29"/>
  </g>

  <!-- Lattice nodes — 6 vertices (alternating amber/crystal) -->
  <g opacity="0.6">
    <circle cx="0" cy="-58" r="1.8" fill="#8aecf5"/>
    <circle cx="50.2" cy="-29" r="1.8" fill="#f5dc72"/>
    <circle cx="50.2" cy="29" r="1.8" fill="#8aecf5"/>
    <circle cx="0" cy="58" r="1.8" fill="#f5dc72"/>
    <circle cx="-50.2" cy="29" r="1.8" fill="#8aecf5"/>
    <circle cx="-50.2" cy="-29" r="1.8" fill="#f5dc72"/>
  </g>

  <!-- Central brilliant — harmonizing core -->
  <circle r="5" fill="url(#prism)" opacity="0.55"/>
  <circle r="2.2" fill="#ffffff" opacity="0.85"/>

  <!-- Radial rays — 6-fold symmetric light emission -->
  <g stroke="url(#crystal)" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="-62" x2="0" y2="-105"/>
    <line x1="53.7" y1="-31" x2="90.9" y2="-52.5"/>
    <line x1="53.7" y1="31" x2="90.9" y2="52.5"/>
    <line x1="0" y1="62" x2="0" y2="105"/>
    <line x1="-53.7" y1="31" x2="-90.9" y2="52.5"/>
    <line x1="-53.7" y1="-31" x2="-90.9" y2="-52.5"/>
  </g>
</svg>
