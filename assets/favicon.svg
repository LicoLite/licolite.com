<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e4b84a"/>
      <stop offset="50%" stop-color="#f5dc72"/>
      <stop offset="100%" stop-color="#c99b2e"/>
    </linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#56d4e8"/>
      <stop offset="50%" stop-color="#8aecf5"/>
      <stop offset="100%" stop-color="#2cb8d8"/>
    </linearGradient>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e4b84a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8aecf5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#56d4e8" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="f" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#121318"/>

  <!-- Outer hexagon -->
  <polygon fill="none"
    points="32,8 52.8,19.5 52.8,44.5 32,56 11.2,44.5 11.2,19.5"
    stroke="url(#p)" stroke-width="0.4" opacity="0.25"/>

  <!-- Inner hexagon — crystal core -->
  <polygon
    points="32,20 42.5,26 42.5,38 32,44 21.5,38 21.5,26"
    fill="url(#f)" stroke="url(#a)" stroke-width="0.8" opacity="0.65"/>

  <!-- Facet highlight -->
  <polygon points="32,20 42.5,26 32,32" fill="#ffffff" opacity="0.07"/>

  <!-- Lattice lines -->
  <g opacity="0.22" stroke="url(#c)" stroke-width="0.35">
    <line x1="32" y1="20" x2="32" y2="44"/>
    <line x1="21.5" y1="26" x2="42.5" y2="38"/>
    <line x1="21.5" y1="38" x2="42.5" y2="26"/>
  </g>

  <!-- Lattice nodes -->
  <g opacity="0.6">
    <circle cx="32" cy="20" r="1.1" fill="#8aecf5"/>
    <circle cx="42.5" cy="26" r="1.1" fill="#f5dc72"/>
    <circle cx="42.5" cy="38" r="1.1" fill="#8aecf5"/>
    <circle cx="32" cy="44" r="1.1" fill="#f5dc72"/>
    <circle cx="21.5" cy="38" r="1.1" fill="#8aecf5"/>
    <circle cx="21.5" cy="26" r="1.1" fill="#f5dc72"/>
  </g>

  <!-- Central brilliant -->
  <circle cx="32" cy="32" r="2.4" fill="url(#p)" opacity="0.55"/>
  <circle cx="32" cy="32" r="1" fill="#ffffff" opacity="0.85"/>

  <!-- Radial rays — 6-fold symmetric -->
  <g stroke="url(#c)" stroke-width="0.4" opacity="0.3">
    <line x1="32" y1="19" x2="32" y2="11"/>
    <line x1="43.2" y1="25.5" x2="50.5" y2="21"/>
    <line x1="43.2" y1="38.5" x2="50.5" y2="43"/>
    <line x1="32" y1="45" x2="32" y2="53"/>
    <line x1="20.8" y1="38.5" x2="13.5" y2="43"/>
    <line x1="20.8" y1="25.5" x2="13.5" y2="21"/>
  </g>
</svg>
